<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fútbol Gol</title>
<link rel="icon" href="logo.jpg">
<meta name="theme-color" content="#14246B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8102E; --red-d:#A00D25; --red-l:#FDECEF;
  --navy:#14246B; --navy-d:#0D1848; --navy-l:#EAEDF8;
  --bg:#F4F5F9; --card:#FFFFFF; --text:#151826; --muted:#6B7085; --line:#E4E6EE;
  --ok:#14804A; --ok-l:#E3F5EB; --warn:#B45309; --warn-l:#FEF3E2;
  --r:16px; --shadow:0 1px 2px rgba(16,24,64,.06),0 4px 16px rgba(16,24,64,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 10% -10%,#2a3a8f 0,transparent 60%),linear-gradient(160deg,var(--navy) 0%,var(--navy-d) 55%,var(--red-d) 140%)}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:32px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.login-card img{width:92px;height:92px;border-radius:22px;object-fit:cover;box-shadow:0 6px 20px rgba(200,16,46,.35)}
.login-card h1{margin:16px 0 4px;font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.5px}
.login-card p.sub{margin:0 0 22px;color:var(--muted)}
.code-input{letter-spacing:12px;text-align:center;font-size:28px!important;font-weight:700}

/* ---------- Layout ---------- */
#app{min-height:100%}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
header.top img{width:36px;height:36px;border-radius:10px;object-fit:cover}
header.top .brand{font-weight:800;font-size:18px;letter-spacing:-.3px;flex:1}
header.top .brand small{display:block;font-weight:500;font-size:12px;opacity:.75;letter-spacing:0}
.avatar-btn{width:36px;height:36px;border-radius:50%;background:var(--red);border:0;color:#fff;font-weight:700;cursor:pointer}
main{padding:16px 16px 100px;max-width:1100px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--red)}
@media(min-width:900px){
  #app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr}
  header.top{grid-column:1/3}
  nav.tabs{position:sticky;top:56px;height:calc(100vh - 56px);flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:16px 10px;gap:4px;justify-content:flex-start}
  nav.tabs button{flex:0;flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;border-radius:12px;justify-content:flex-start}
  nav.tabs button.on{background:var(--red-l)}
  main{padding:28px 32px 40px;width:100%}
}

/* ---------- Componentes ---------- */
h2.title{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:4px 0 4px}
p.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.gauto{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
.kpi{padding:14px 16px}
.kpi .n{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:500}
.kpi.ok .n{color:var(--ok)} .kpi.bad .n{color:var(--red)} .kpi.money .n{color:var(--navy)}
.sede-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sede-head h3{margin:0;font-size:17px;font-weight:700}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#22a565);border-radius:8px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 4px}
.qa{border:0;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:13px;cursor:pointer}
.qa .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.qa .ic svg{width:22px;height:22px}
.ic.r{background:var(--red-l);color:var(--red)} .ic.b{background:var(--navy-l);color:var(--navy)} .ic.g{background:var(--ok-l);color:var(--ok)}

.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .05s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--red);color:#fff} .btn.primary:hover{background:var(--red-d)}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--navy-l);color:var(--navy)}
.btn.wa{background:#25D366;color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{background:none;border:0;color:var(--red);font-weight:600;cursor:pointer;padding:6px}

label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;outline:none;font-size:16px}
.in:focus{border-color:var(--navy)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.search{position:relative;margin-bottom:12px}
.search input{padding-left:42px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:grid;grid-auto-flow:column;gap:8px}
.seg .chip{text-align:center;padding:11px 8px}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:var(--navy);font-size:15px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-l);color:var(--ok)} .pill.bad{background:var(--red-l);color:var(--red)} .pill.mute{background:#EEF0F4;color:var(--muted)} .pill.warn{background:var(--warn-l);color:var(--warn)}
.money{font-weight:800;color:var(--navy);white-space:nowrap}
.group-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 2px 8px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

.gcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.gcard .gh{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.gcard .time{background:var(--navy);color:#fff;border-radius:12px;padding:8px 10px;text-align:center;font-weight:800;min-width:64px;line-height:1.1}
.gcard .time small{display:block;font-size:11px;font-weight:600;opacity:.8}
.gcard .gb{border-top:1px solid var(--line);padding:6px 10px 10px}
.kid{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}
.kid:last-child{border-bottom:0}
.kid .av{width:32px;height:32px;font-size:12px}

/* ---------- Sheet / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
.sheet .sh-head{padding:18px 20px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet .sh-head h3{margin:0;font-size:19px;font-weight:800;flex:1}
.sheet .sh-body{padding:4px 20px 20px;overflow-y:auto}
.sheet .sh-foot{padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.x{width:36px;height:36px;border-radius:50%;border:0;background:#EEF0F4;cursor:pointer;font-size:18px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--red)}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;cursor:pointer;display:flex;align-items:center;gap:12px;background:#fff}
.opt.on{border-color:var(--red);background:var(--red-l)}
.opt.dis{opacity:.45;pointer-events:none}
.summary{background:var(--bg);border-radius:14px;padding:14px;margin-top:12px}
.summary .r{display:flex;justify-content:space-between;padding:5px 0;gap:10px}
.summary .r span:first-child{color:var(--muted)}
.big-amount{font-size:34px;font-weight:800;color:var(--navy);letter-spacing:-1px;text-align:center;margin:10px 0 2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0}
.kv span:nth-child(odd){color:var(--muted)}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90%;text-align:center}
#toast.err{background:var(--red)}
#loading{position:fixed;inset:0;z-index:90;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--navy-l);border-top-color:var(--red);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.menu-list .item{cursor:pointer}
.sec-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.sec-icon svg{width:20px;height:20px}
.ro-banner{display:flex;align-items:center;gap:8px;background:#F1ECFE;color:#5B21B6;font-weight:600;font-size:13px;border-radius:12px;padding:9px 12px;margin-bottom:12px}
.ro-banner svg{width:16px;height:16px;flex:none}
.chip[disabled]{opacity:.6;cursor:default}
.in[disabled],.in[readonly]{background:#F6F7FA;color:var(--muted)}
.kv{word-break:break-word}
.sh-foot:empty{display:none}
.yn-list{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.yn-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.yn-row:first-child{border-top:0}
.yn-row>span:first-child{flex:1}
.yn{display:flex;gap:6px;flex:none}
.yn label{cursor:pointer}
.yn input{position:absolute;opacity:0;pointer-events:none}
.yn b{display:inline-block;min-width:44px;text-align:center;padding:6px 10px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;color:var(--muted);background:#fff}
.yn input:checked+b{background:var(--navy);border-color:var(--navy);color:#fff}
.yn input[value=S]:checked+b,.yn input[value=NO]:checked+b{background:var(--red);border-color:var(--red)}
.yn-big{flex-direction:column}
.ls-kid.on{background:#EAF7EF;border-color:#9AD8B0}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#E3E6EE}
.dot.si{background:#1E9E5A}.dot.no{background:var(--red)}
.ic.w{background:#FFF4DE;color:#B45309}
.yn-big b{display:block;text-align:left;padding:12px 14px;border-radius:12px;font-size:14px}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="login" class="hidden">
  <div class="login-card">
    <img class="logo-img" alt="Fútbol Gol">
    <h1>Fútbol Gol</h1>
    <p class="sub">Gestión de la escuelita</p>
    <div id="lg-step1">
      <input id="lg-email" class="in" type="email" inputmode="email" autocomplete="email" placeholder="tu-mail@gmail.com">
      <button class="btn primary block" style="margin-top:12px" onclick="Login.send()">Enviarme un código</button>
      <p style="color:var(--muted);font-size:13px;margin:14px 0 0">Te mandamos un código de 6 dígitos a tu mail. Solo pueden entrar los mails habilitados por la escuelita.</p>
    </div>
    <div id="lg-step2" class="hidden">
      <p style="margin:0 0 10px">Ingresá el código que enviamos a<br><b id="lg-email-show"></b></p>
      <input id="lg-code" class="in code-input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
      <button class="btn primary block" style="margin-top:12px" onclick="Login.verify()">Entrar</button>
      <button class="link" style="margin-top:8px" onclick="Login.back()">Usar otro mail</button>
    </div>
    <div id="lg-step3" class="hidden"></div>
  </div>
</section>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header class="top">
    <img class="logo-img" alt="">
    <div class="brand">Fútbol Gol<small id="hdr-sub"></small></div>
    <button class="avatar-btn" id="hdr-av" onclick="go('mas')"></button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<section id="publico" class="hidden">
  <header class="top"><img class="logo-img" alt=""><div class="brand">Fútbol Gol<small>Inscripción</small></div></header>
  <main id="pub-view" style="max-width:560px;margin:0 auto;padding:16px 16px 40px"></main>
</section>

<div id="sheet-root"></div>
<div id="toast" class="hidden"></div>
<div id="loading" class="hidden"><div class="spin"></div></div>

<script>
// Reemplaza google.script.run: habla con Apps Script por fetch, sin cookies ni cuentas de Google
(function () {
  var FN = ['requestCode', 'verifyCode', 'verifyTotp', 'logout', 'api', 'publicSedes', 'enviarSolicitud'];
  function runner(ok, fail) {
    var r = {
      withSuccessHandler: function (f) { return runner(f, fail); },
      withFailureHandler: function (f) { return runner(ok, f); }
    };
    FN.forEach(function (n) {
      r[n] = function () {
        var args = Array.prototype.slice.call(arguments);
        fetch(window.FG_BACKEND, {
          method: 'POST', body: JSON.stringify({ fn: n, args: args }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', credentials: 'omit', cache: 'no-store'
        }).then(function (x) {
          if (!x.ok) throw new Error('HTTP ' + x.status);
          return x.json();
        }).then(function (j) {
          if (j.ok) { if (ok) ok(j.r); } else if (fail) fail(new Error(j.error));
        }, function () {
          if (fail) fail(new Error('No se pudo conectar. Revisá la conexión y probá de nuevo.'));
        });
      };
    });
    return r;
  }
  window.google = { script: { run: runner() } };
})();

</script>

function horarios(g){ var h=[{dia:g.dia,inicio:g.inicio,fin:g.fin,cancha:g.cancha}]; if(g.dia2) h.push({dia:g.dia2,inicio:g.inicio2,fin:g.fin2,cancha:g.cancha2||g.cancha}); return h; }

function grupoLabel(g){ if(!g) return 'Sin grupo'; var h=horarios(g), canchas=h.map(function(x){return x.cancha;}).filter(function(x,i,a){ return x && a.indexOf(x)===i; }); return horarioTxt(g)+(canchas.length?' · '+canchas.join(' / '):'')+(g.nombre?' · '+g.nombre:''); }
function diaHoy(){ var p=D().hoy.split('-'); var w=new Date(+p[0],+p[1]-1,+p[2]).getDay(); return D().dias[(w+6)%7]; }

function montoHoy(c){ return D().diaHoy>15 ? c.cuotaRecargo : c.cuota; }
function nombreP(p){ return p ? ((p.nombre||'')+' '+(p.apellido||'')).trim() : ''; }
function telPrincipal(c){ return c.telContacto || (c.madre&&c.madre.telefono) || (c.padre&&c.padre.telefono) || ''; }
function tutorNombre(c){ return (c.madre&&c.madre.telefono&&c.madre.nombre) || (c.padre&&c.padre.telefono&&c.padre.nombre) || (c.madre&&c.madre.nombre) || ''; }
function fmtTel(t){ if(!t) return ''; t=String(t); if(t.indexOf('549')===0 && t.length===13){ var r=t.slice(3); return r.slice(0,2)+' '+r.slice(2,6)+' '+r.slice(6); } return t; }
function telInput(t){ return t && String(t).indexOf('549')===0 ? fmtTel(t) : (t||''); }
function hermanos(c){ return D().chicos.filter(function(o){ return o.id!==c.id && o.familiaKey && o.familiaKey===c.familiaKey; }); }
function chicosVisibles(){
  var cs = D().chicos.slice();
  if(S.filtroSede) cs = cs.filter(function(c){ return c.sede===S.filtroSede; });
  return cs;
}
function inscriptos(gid){ return D().chicos.filter(function(c){ return c.grupo===gid && c.activo; }).length; }
function tarifaVigente(sedeId){ var best=null; D().tarifas.forEach(function(t){ if(t.sede===sedeId && t.desde && t.desde<=D().hoy && (!best||t.desde>=best.desde)) best=t; }); return best; }
// Vista previa de la cuota (el cálculo final lo hace el servidor)
function calcCuota(sedeId, hermanoDe, nacimiento, beca){
  var t = tarifaVigente(sedeId); if(!t) return null;
  var orden = 1, h = hermanoDe ? byId(D().chicos, hermanoDe) : null;
  if(h) D().chicos.forEach(function(o){ if(o.familiaKey===h.familiaKey && o.activo && o.nacimiento && nacimiento && o.nacimiento<=nacimiento) orden++; });
  var desc = orden===2 ? t.desc2 : (orden>=3 ? t.desc3 : 0);
  var cuota = Math.round(t.base*(1-desc/100)*(1-(beca||0)/100));
  return { orden:orden, desc:desc, cuota:cuota, recargo:Math.round(cuota*(1+t.recargo/100)), base:t.base, pctRecargo:t.recargo };
}
function textoBusqueda(c){
  var m=c.madre||{}, p=c.padre||{};
  return [c.nombre,c.apellido,c.dni,c.telContacto,m.nombre,m.apellido,m.dni,m.telefono,p.nombre,p.apellido,p.dni,p.telefono].join(' ').toLowerCase();
}

function go(tab){

function sedeChips(key){

/* ================= Vista: Inicio ================= */
function vInicio(){
  var d = D(), mes = d.mesActual;
  var sedes = d.sedes.filter(function(s){ return s.activa; });
  var html = roBanner()+'<h2 class="title">Hola, '+esc((d.user.nombre||'').split(' ')[0])+'</h2><p class="lead">Resumen de '+mesNombre(mes)+'</p>';
  html += canEdit() ? '<div class="actions">'+
    '<button class="qa" onclick="Onboarding.open()"><span class="ic r">'+ICON.plus+'</span>Inscribir chico</button>'+
    '<button class="qa" onclick="go(\'cobrar\')"><span class="ic g">'+ICON.cash+'</span>Cobrar</button>'+
    '<button class="qa" onclick="go(\'grupos\')"><span class="ic b">'+ICON.grid+'</span>Grupos</button></div>'
    : '<div class="actions">'+
    '<button class="qa" onclick="go(\'chicos\')"><span class="ic r">'+ICON.kids+'</span>Chicos</button>'+
    (sinPlata()?'<button class="qa" onclick="Solicitudes.open()"><span class="ic g">'+ICON.plus+'</span>Inscripciones</button>':'<button class="qa" onclick="go(\'cobrar\')"><span class="ic g">'+ICON.cash+'</span>Deudores</button>')+
    '<button class="qa" onclick="go(\'grupos\')"><span class="ic b">'+ICON.grid+'</span>Grupos</button></div>';
  html += paraHoyHtml();
  html += clasesHoyHtml();
  if(sinPlata()){
    html += '<div class="grid g2 g4">'+sedes.map(function(s){ return kpi(d.chicos.filter(function(c){ return c.sede===s.id && c.activo; }).length, esc(s.nombre), ''); }).join('')+'</div>';
    return html;
  }
  var tot = {act:0,ok:0,debe:0,cobrado:0};
  var bloques = sedes.map(function(s){
    var cs = d.chicos.filter(function(c){ return c.sede===s.id && c.activo; });
    var ok = cs.filter(function(c){ return c.pagoMes; }).length;
    var ids = {}; cs.forEach(function(c){ ids[c.id]=1; });
    var cobrado = d.pagos.filter(function(p){ return p.fecha && p.fecha.slice(0,7)===mes && ids[p.chico]; }).reduce(function(a,p){ return a+p.monto; },0);
    tot.act+=cs.length; tot.ok+=ok; tot.debe+=cs.length-ok; tot.cobrado+=cobrado;
    var pct = cs.length ? Math.round(ok*100/cs.length) : 0;
    return '<div class="sede-head"><h3>'+esc(s.nombre)+'</h3><span class="pill '+(pct>=80?'ok':pct>=50?'warn':'bad')+'">'+pct+'% al día</span></div>'+
      '<div class="grid g2 g4">'+kpi(cs.length,'Activos','')+kpi(ok,'Pagaron','ok')+kpi(cs.length-ok,'Deben','bad')+kpi(money(cobrado),'Cobrado en el mes','money')+'</div>'+
      '<div class="bar" style="margin-top:10px"><i style="width:'+pct+'%"></i></div>';
  }).join('');
  if(sedes.length>1){
    html += '<div class="sede-head"><h3>Total escuelita</h3></div><div class="grid g2 g4">'+kpi(tot.act,'Activos','')+kpi(tot.ok,'Pagaron','ok')+kpi(tot.debe,'Deben','bad')+kpi(money(tot.cobrado),'Cobrado en el mes','money')+'</div>';
  }
  html += bloques || '<div class="empty"><b>Todavía no hay sedes</b>Cargalas desde Más → Sedes.</div>';
  return html;
}
function kpi(n,l,cls){ return '<div class="card kpi '+cls+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }

/* ================= Vista: Chicos ================= */
function vChicos(){
  var q = S.q.toLowerCase().trim();
  var cs = chicosVisibles();
  var prof = sinPlata();
  var f = S.chicosFiltro;
  if(f==='debe') cs = cs.filter(function(c){ return c.activo && !c.pagoMes; });
  else if(f==='ok') cs = cs.filter(function(c){ return c.activo && c.pagoMes; });
  else if(f==='baja') cs = cs.filter(function(c){ return !c.activo; });
  else if(f==='apto') cs = cs.filter(function(c){ return c.activo && !c.apto; });
  else cs = cs.filter(function(c){ return c.activo; });
  if(q) cs = cs.filter(function(c){ return textoBusqueda(c).indexOf(q)>-1 || textoBusqueda(c).replace(/\D/g,'').indexOf(q.replace(/\D/g,'')||'§')>-1; });
  cs.sort(function(a,b){ return (a.apellido+a.nombre).localeCompare(b.apellido+b.nombre); });
  var html = roBanner()+'<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h2 class="title">Chicos</h2>'+
    (canEdit()?'<button class="btn primary sm" onclick="Onboarding.open()">'+ICON.plus.replace('<svg','<svg width="16" height="16"')+'Inscribir</button>':'')+'</div>'+
    '<p class="lead">'+cs.length+' '+(cs.length===1?'chico':'chicos')+'</p>'+
    '<div class="search">'+ICON.search+'<input class="in" placeholder="Buscar por chico, madre, padre, DNI o teléfono" value="'+esc(S.q)+'" oninput="S.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(function(){var p=document.activeElement.selectionStart;render();var i=document.querySelector(\'.search input\');i.focus();i.setSelectionRange(p,p);},250)"></div>'+
    sedeChips('filtroSede');
  html += '<div class="chips">'+(prof?[['todos','Activos'],['apto','Sin apto físico'],['baja','Dados de baja']]:[['todos','Activos'],['debe','Deben'],['ok','Al día'],['apto','Sin apto físico'],['baja','Dados de baja']]).map(function(x){ return '<button class="chip'+(f===x[0]?' on':'')+'" onclick="S.chicosFiltro=\''+x[0]+'\';render()">'+x[1]+'</button>'; }).join('')+'</div>';
  if(!cs.length) return html + '<div class="empty"><b>No hay chicos para mostrar</b>Probá con otro filtro o búsqueda.</div>';
  html += '<div class="list">'+cs.map(function(c){
    var g = grupo(c.grupo);
    var pill = !c.activo ? '<span class="pill mute">Baja</span>' : prof ? '' : c.pagoMes ? '<span class="pill ok">Al día</span>' : '<span class="pill bad">Debe</span>';
    return '<div class="item" onclick="Ficha.open(\''+c.id+'\')">'+avatar(c)+'<div class="main"><div class="t">'+esc(c.nombre+' '+c.apellido)+'</div><div class="s">'+esc(sede(c.sede).nombre+' · '+grupoLabel(g))+'</div></div>'+pill+'</div>';
  }).join('')+'</div>';
  return html;
}
function avatar(c){ return '<div class="av" style="background:'+colorFor(c.id)+'">'+initials(c.nombre,c.apellido)+'</div>'; }

/* ================= Vista: Cobrar / Deudores ================= */
function vCobrar(){

/* ================= Vista: Grupos ================= */
function vGrupos(){

  if(S.grupoSede) gs = gs.filter(function(g){ return g.sede===S.grupoSede; });

  gs.forEach(function(g){ horarios(g).forEach(function(h){ if(!S.grupoDia || h.dia===S.grupoDia) slots.push({g:g,h:h}); }); });
  slots.sort(function(a,b){ return (d.dias.indexOf(a.h.dia)-d.dias.indexOf(b.h.dia)) || a.h.inicio.localeCompare(b.h.inicio) || String(a.h.cancha).localeCompare(String(b.h.cancha)); });

    (ed?'<button class="btn primary sm" onclick="GrupoForm.open()">'+ICON.plus.replace('<svg','<svg width="16" height="16"')+'Nuevo grupo</button>':'')+'</div><p class="lead">'+gs.length+(gs.length===1?' grupo':' grupos')+'</p>';

  if(!slots.length) return html+'<div class="empty"><b>No hay grupos</b>'+(prof?'Todavía no tenés grupos asignados.':ed?'Creá el primero con "Nuevo grupo".':'Todavía no hay grupos cargados.')+'</div>';
  var lastKey='';

    var kids = d.chicos.filter(function(c){ return c.grupo===g.id && c.activo; }).sort(function(a,b){ return a.apellido.localeCompare(b.apellido); });

    var otro = horarios(g).filter(function(x){ return x.dia!==h.dia; })[0];
    var ul = ultimaLista(g.id);
    return head+'<div class="gcard"><div class="gh" onclick="this.parentNode.querySelector(\'.gb\').classList.toggle(\'hidden\')"><div class="time">'+esc(h.inicio)+'<small>'+esc((h.dia||'').slice(0,3))+'</small></div>'+
      '<div style="flex:1;min-width:0"><div style="font-weight:800">'+esc(g.nombre||'Grupo')+'</div><div style="color:var(--muted);font-size:13px">'+esc([sede(g.sede).nombre,h.cancha,prof?'':profeNombre(g.profe)].filter(Boolean).join(' · '))+'</div>'+
      (otro?'<div style="color:var(--muted);font-size:12px">También '+esc(otro.dia.toLowerCase()+' '+otro.inicio)+'</div>':'')+
      '<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><div class="bar" style="flex:1"><i style="width:'+pct+'%;'+(pct>=100?'background:var(--red)':'')+'"></i></div><span style="font-size:12px;font-weight:700;color:var(--muted)">'+kids.length+(cupo?'/'+cupo:'')+'</span></div></div></div>'+
      '<div class="gb hidden">'+(kids.map(function(c){ var as=asistenciaChico(c.id); return '<div class="kid">'+avatar(c)+'<div style="flex:1" onclick="Ficha.open(\''+c.id+'\')"><div style="font-weight:600">'+esc(c.nombre+' '+c.apellido)+'</div><div style="font-size:12px;color:var(--muted)">'+edad(c.nacimiento)+' años'+(as.total?' · asistencia '+as.pct+'%':'')+'</div></div>'+
        (prof?'':(c.pagoMes?'<span class="pill ok">Al día</span>':'<span class="pill bad">Debe</span>'))+'</div>'; }).join('')||'<div class="empty" style="padding:16px">Sin chicos todavía</div>')+

      (ed?'<button class="btn ghost sm" onclick="GrupoForm.open(\''+g.id+'\')">Editar grupo</button>':'')+'</div></div></div>';
  }).join('') + '</div>';

function readFileCompressed(file){
  return new Promise(function(res){
    var r = new FileReader();
    r.onload = function(){
      if(file.type.indexOf('image')!==0){ res(r.result); return; }
      var img = new Image();
      img.onload = function(){
        var max=1400, w=img.width, h=img.height, k=Math.min(1,max/Math.max(w,h));
        var cv=document.createElement('canvas'); cv.width=Math.round(w*k); cv.height=Math.round(h*k);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',0.82));
      };
      img.onerror = function(){ res(r.result); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

  if(p.dni && (p.dni.length<7||p.dni.length>8)) return 'El DNI de '+quien+' tiene que tener 7 u 8 números';

var Publico = {
  st:null, sedes:[],
  init: function(){
    $('login').classList.add('hidden'); $('app').classList.add('hidden'); $('publico').classList.remove('hidden');
    Publico.st = { step:1, c:chicoVacio(), sede:'', hermanos:'' }; FichaUI.apto=null;
    loading(true);
    call('publicSedes').then(function(r){ loading(false); Publico.sedes=r.sedes; FichaUI.preguntas=r.preguntas; if(r.sedes.length===1) Publico.st.sede=r.sedes[0].id; Publico.render(); })
      .catch(function(e){ loading(false); $('pub-view').innerHTML='<div class="empty"><b>No pudimos cargar el formulario</b>'+esc(e.message)+'</div>'; });
  },
  PP:['Datos del chico','Ficha de salud','Responsables','Autorizaciones','Revisar y enviar'],
  render: function(){
    var st=Publico.st, c=st.c, n=st.step, b='';
    b += '<h2 class="title" style="margin-bottom:2px">Ficha de inscripción y salud</h2><div class="steps">'+[1,2,3,4,5].map(function(i){ return '<i class="'+(i<=n?'on':'')+'"></i>'; }).join('')+'</div><p class="lead" style="margin-top:10px"><b>Paso '+n+' de 5 · '+Publico.PP[n-1]+'</b></p>';
    if(n===1) b += '<label class="f">Sede a la que concurre</label><div class="chips" style="margin-top:0">'+Publico.sedes.map(function(s){ return '<button class="chip'+(st.sede===s.id?' on':'')+'" onclick="Publico.read();Publico.st.sede=\''+s.id+'\';Publico.render()">'+esc(s.nombre)+'</button>'; }).join('')+'</div>'+fxChico(c);
    if(n===2) b += fxSalud(c, true);
    if(n===3) b += fxResp(c)+fld('¿Tiene hermanos que ya van a la escuelita? ¿Cómo se llaman?','pb-herm',st.hermanos,'placeholder="Dejalo vacío si no"');
    if(n===4) b += fxAutor(c, true)+'<input id="pb-web" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;opacity:0" aria-hidden="true">';
    if(n===5) b += resumenFicha(c, [['Sede',(byIdArr(Publico.sedes,st.sede)||{}).nombre||'']].concat(st.hermanos?[['Hermanos',st.hermanos]]:[]))+
        '<p style="font-size:13px;color:var(--muted)">La escuelita revisa la ficha, le asigna el grupo y se comunica con ustedes.</p>';
    b += '<div style="display:flex;gap:8px;margin-top:18px">'+(n>1?'<button class="btn ghost" onclick="Publico.read();Publico.st.step--;Publico.render()">Atrás</button>':'')+
      (n<5?'<button class="btn primary" style="flex:1" onclick="Publico.next()">Siguiente</button>':'<button class="btn primary" style="flex:1" onclick="Publico.send()">Enviar ficha</button>')+'</div>';
    $('pub-view').innerHTML = b; window.scrollTo(0,0);
  },
  read: function(){
    var st=Publico.st, c=st.c, n=st.step;
    if(n===1) rxChico(c);
    if(n===2) rxSalud(c);
    if(n===3){ rxResp(c); st.hermanos=val('pb-herm'); }
    if(n===4){ rxAutor(c); st.web=val('pb-web'); }
  },
  valid: function(n){
    var st=Publico.st, c=st.c;
    if(n===1){ if(!st.sede) return 'Elegí la sede'; return vChico(c,true); }
    if(n===2) return vSalud(c,true);
    if(n===3){ if(!c.madre.nombre && !c.padre.nombre) return 'Cargá los datos de la madre, el padre o tutor/a'; return vResp(c); }
    if(n===4) return vAutor(c,true);
    return '';
  },
  next: function(){ Publico.read(); var e=Publico.valid(Publico.st.step); if(e){ toast(e,true); return; } Publico.st.step++; Publico.render(); },
  send: function(){
    var st=Publico.st, c=st.c, p=fichaPayload(c);
    p.sede=st.sede; p.hermanos=st.hermanos; p.web=st.web; p.aptoData=FichaUI.apto;
    loading(true);
    call('enviarSolicitud', p).then(function(){
      loading(false);
      $('pub-view').innerHTML = '<div style="text-align:center;padding:30px 6px"><div style="font-size:54px">⚽</div><h2 class="title">¡Listo!</h2><p class="lead">Recibimos la ficha de <b>'+esc(c.nombre)+'</b>. La escuelita la revisa y se comunica con ustedes.</p>'+
        (FichaUI.apto?'':'<p style="font-size:13px;color:var(--muted)">Recordá presentar el certificado de aptitud física.</p>')+
        '<button class="btn ghost block" style="margin-top:18px" onclick="Publico.otro()">Inscribir a otro hijo</button></div>';
    }).catch(function(e){ loading(false); toast(e.message,true); });
  },
  // Otro hermano: mantiene sede, domicilio, responsables, obra social y autorizados
  otro: function(){
    var st=Publico.st, o=st.c, prev=o.nombre+' '+o.apellido, c=chicoVacio();
    ['apellido','direccion','localidad','telContacto','madre','padre','obraSocial','osTel','autorizados','imagen'].forEach(function(k){ c[k]=o[k]; });
    FichaUI.apto=null;
    Publico.st = { step:1, c:c, sede:st.sede, hermanos:(st.hermanos?st.hermanos+', ':'')+prev+' (inscripto recién)' };
    Publico.render();
  }
};
function byIdArr(a,id){ for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }

/* ================= Ficha de inscripción y salud 2027 (campos compartidos) ================= */
var FichaUI = { apto:null, preguntas:[] };
function preguntasSalud(){ return (S.data && S.data.saludPreguntas) || FichaUI.preguntas || []; }
function soloDig(v){ return String(v||'').replace(/\D/g,''); }
function telNorm(v){ var t=soloDig(v); if(t && t.indexOf('54')!==0) t='549'+t.replace(/^0/,''); return t; }

// --- Paso: datos del chico
function fxChico(c){
  return '<div class="row2"><div>'+fld('Nombre','fc-nombre',c.nombre)+'</div><div>'+fld('Apellido','fc-apellido',c.apellido)+'</div></div>'+
    '<div class="row2"><div>'+fld('DNI','fc-dni',c.dni,'inputmode="numeric" placeholder="Sin puntos"')+'</div><div>'+fld('Fecha de nacimiento','fc-nac',c.nacimiento,'type="date"')+'</div></div>'+
    fld('Teléfono celular de contacto','fc-tel',telInput(c.telContacto),'inputmode="tel" placeholder="11 1234 5678"')+
    '<div class="row2"><div>'+fld('Domicilio','fc-dir',c.direccion,'placeholder="Calle y número"')+'</div><div>'+fld('Localidad','fc-loc',c.localidad)+'</div></div>';
}
function rxChico(c){
  c.nombre=val('fc-nombre'); c.apellido=val('fc-apellido'); c.dni=soloDig(val('fc-dni')); c.nacimiento=val('fc-nac');
  c.telContacto=telNorm(val('fc-tel')); c.direccion=val('fc-dir'); c.localidad=val('fc-loc');
}
function vChico(c, estricto){
  if(!c.nombre||!c.apellido) return 'Completá nombre y apellido';
  if(estricto && !c.dni) return 'Completá el DNI del chico';
  if(c.dni && (c.dni.length<7||c.dni.length>8)) return 'El DNI del chico tiene que tener 7 u 8 números';
  if(!c.nacimiento) return 'Completá la fecha de nacimiento';
  if(c.telContacto && c.telContacto.length!==13) return 'Revisá el teléfono de contacto (código de área sin 0 ni 15)';
  return '';
}

// --- Paso: ficha de salud
function fxSalud(c, publico){
  var qs = preguntasSalud(), s = c.salud||[];
  var tieneApto = FichaUI.apto || c.apto;
  return fld('Cobertura médica (obra social)','fs-os',c.obraSocial,'placeholder="Ej.: OSDE 210 / No tiene"')+
    '<div class="row2"><div>'+fld('Nº de afiliado','fs-af',c.osAfiliado)+'</div><div>'+fld('Tel. de emergencia','fs-et',c.osTel,'inputmode="tel" placeholder="Ej.: 0800 555 6733"')+'</div></div>'+
    '<div class="group-title">Antecedentes personales y familiares</div><div class="yn-list">'+qs.map(function(q,i){
      return '<div class="yn-row"><span>'+esc(q)+'</span><span class="yn"><label><input type="radio" name="fs-q'+i+'" value="S"'+(s[i]==='S'?' checked':'')+'><b>SÍ</b></label><label><input type="radio" name="fs-q'+i+'" value="N"'+(s[i]==='N'?' checked':'')+'><b>NO</b></label></span></div>';
    }).join('')+'</div>'+
    (publico?'<button class="link" style="margin:8px 0 0" onclick="FichaUI.todoNo()">Marcar todo NO</button>':'')+
    '<label class="f">Detalle de respuestas afirmativas, medicación, alergias o indicaciones médicas</label><textarea class="in" id="fs-det" rows="3">'+esc(c.saludDetalle||'')+'</textarea>'+
    '<div class="summary" style="font-size:13px"><b>Importante:</b> para participar es indispensable presentar certificado de aptitud física que autorice actividades físico deportivas.</div>'+
    '<label class="f">Certificado de aptitud física (foto)</label><label class="opt" style="margin-top:0"><input type="file" accept="image/*" style="display:none" onchange="FichaUI.pickApto(this)"><span class="sec-icon ic g">'+ICON.save+'</span><span id="fs-apto">'+(FichaUI.apto?'✓ Foto del apto cargada':(c.apto?'✓ Ya presentado · tocá para reemplazar':'Sacar foto o elegir de la galería'))+'</span></label>'+
    (publico&&!tieneApto?'<div style="font-size:12px;color:var(--muted);margin-top:4px">Si todavía no lo tenés, podés enviarlo igual y presentarlo después.</div>':'');
}
function rxSalud(c){
  c.obraSocial=val('fs-os'); c.osAfiliado=val('fs-af'); c.osTel=val('fs-et'); c.saludDetalle=val('fs-det');
  c.salud = preguntasSalud().map(function(q,i){ var r=document.querySelector('input[name="fs-q'+i+'"]:checked'); return r?r.value:''; });
}
function vSalud(c, estricto){
  var qs=preguntasSalud(), s=c.salud||[];
  if(estricto){
    for(var i=0;i<qs.length;i++) if(s[i]!=='S'&&s[i]!=='N') return 'Respondé SÍ o NO: '+qs[i];
    if(s.indexOf('S')>-1 && !c.saludDetalle) return 'Contanos el detalle de las respuestas afirmativas';
  }
  return '';
}
FichaUI.todoNo = function(){ preguntasSalud().forEach(function(q,i){ var r=document.querySelector('input[name="fs-q'+i+'"][value="N"]'); if(r && !document.querySelector('input[name="fs-q'+i+'"]:checked')) r.checked=true; }); };
FichaUI.pickApto = function(inp){ var f=inp.files[0]; if(!f) return; $('fs-apto').textContent='Procesando…'; readFileCompressed(f).then(function(d){
  if(d.indexOf('data:image')!==0){ $('fs-apto').textContent='Tiene que ser una foto'; return; } FichaUI.apto=d; $('fs-apto').textContent='✓ Foto del apto cargada'; }); };

// --- Paso: responsables y autorizados a retirar
function fxResp(c){
  var a=(c.autorizados||[]).slice(); while(a.length<4) a.push({nombre:'',dni:''});
  return personaForm('Madre, tutor/a responsable','ob-m',c.madre)+personaForm('Padre, tutor/a responsable','ob-p',c.padre)+
    '<div class="group-title">Personas autorizadas a retirar al chico</div><div style="font-size:12px;color:var(--muted);margin:-4px 0 6px">Incluí a madre, padre, tutor/a u otras personas autorizadas.</div>'+
    a.slice(0,4).map(function(x,i){ return '<div class="row2" style="align-items:end"><div>'+fld((i+1)+'. Nombre y apellido','fa-n'+i,x.nombre)+'</div><div>'+fld('DNI','fa-d'+i,x.dni,'inputmode="numeric"')+'</div></div>'; }).join('');
}
function rxResp(c){
  c.madre=readPersona('ob-m'); c.padre=readPersona('ob-p');
  c.autorizados=[0,1,2,3].map(function(i){ return { nombre:val('fa-n'+i), dni:soloDig(val('fa-d'+i)) }; }).filter(function(x){ return x.nombre||x.dni; });
}
function vResp(c){
  if(!c.madre.telefono && !c.padre.telefono && !c.telContacto) return 'Cargá al menos un teléfono (de contacto, madre o padre)';
  var e = validPersona(c.madre,'la madre') || validPersona(c.padre,'el padre'); if(e) return e;
  for(var i=0;i<c.autorizados.length;i++){ var x=c.autorizados[i];
    if(!x.nombre) return 'Falta el nombre de un autorizado a retirar';
    if(x.dni && (x.dni.length<7||x.dni.length>8)) return 'Revisá el DNI de '+x.nombre; }
  return '';
}

// --- Paso: autorización de imagen y declaración jurada
function fxAutor(c, publico){
  var dj=c.dj||{}, firmada = dj.fecha && !dj.acepta;
  return '<div class="group-title">Autorización para uso de imagen</div><div style="font-size:13px;color:var(--muted);margin-bottom:8px">Autorizo a la escuela de fútbol a utilizar imágenes o grabaciones en las que aparezca mi hijo/a, de manera individual o grupal, para comunicaciones institucionales, sitio web, redes sociales y publicaciones informativas o publicitarias.</div>'+
    '<div class="yn yn-big"><label><input type="radio" name="fi-img" value="SI"'+(c.imagen==='SI'?' checked':'')+'><b>SÍ, doy mi consentimiento</b></label><label><input type="radio" name="fi-img" value="NO"'+(c.imagen==='NO'?' checked':'')+'><b>NO doy mi consentimiento</b></label></div>'+
    '<label class="f">Observaciones</label><textarea class="in" id="fi-obs" rows="2" placeholder="Algo más que la escuelita tenga que saber">'+esc(c.obs||'')+'</textarea>'+
    '<div class="group-title">Declaración jurada</div>'+
    (firmada?'<div class="summary" style="font-size:13px;margin-top:0">✓ Firmada por <b>'+esc(dj.nombre)+'</b> (DNI '+esc(dj.dni)+') el '+esc(dj.fecha)+'.</div>':'')+
    (firmada&&!publico?'':
    '<label class="opt" style="margin-top:0;align-items:flex-start"><input type="checkbox" id="fd-ok"'+(dj.acepta?' checked':'')+' style="width:20px;height:20px;margin-top:2px;flex:none"><span>Declaro bajo juramento que las respuestas brindadas en esta ficha son verdaderas.</span></label>'+
    '<div class="row2"><div>'+fld('Firma: nombre y apellido (padre, madre o tutor/a)','fd-n',dj.acepta?dj.nombre:'')+'</div><div>'+fld('DNI de quien firma','fd-d',dj.acepta?dj.dni:'','inputmode="numeric"')+'</div></div>'+
    (publico?'':'<div style="font-size:12px;color:var(--muted);margin-top:4px">Completalo solo si quien firma está presente.</div>'));
}
function rxAutor(c){
  var r=document.querySelector('input[name="fi-img"]:checked'); c.imagen = r?r.value:'';
  c.obs=val('fi-obs');
  if($('fd-ok')){ var ok=$('fd-ok').checked;
    if(ok) c.dj={ acepta:true, nombre:val('fd-n'), dni:soloDig(val('fd-d')) };
    else if(c.dj && c.dj.acepta) c.dj={}; }
}
function vAutor(c, estricto){
  if(estricto && !c.imagen) return 'Indicá si autorizás el uso de imagen';
  var dj=c.dj||{};
  if(estricto && !dj.acepta) return 'Falta aceptar la declaración jurada';
  if(dj.acepta){ if(!dj.nombre) return 'Falta el nombre de quien firma'; if(dj.dni.length<7||dj.dni.length>8) return 'Revisá el DNI de quien firma'; }
  return '';
}

// --- Datos que se mandan al servidor
function fichaPayload(c){
  return { nombre:c.nombre, apellido:c.apellido, dni:c.dni, nacimiento:c.nacimiento, telContacto:c.telContacto, direccion:c.direccion, localidad:c.localidad,
    madre:c.madre, padre:c.padre, obraSocial:c.obraSocial, osAfiliado:c.osAfiliado, osTel:c.osTel,
    salud:c.salud, saludDetalle:c.saludDetalle, autorizados:c.autorizados, imagen:c.imagen, dj:c.dj&&c.dj.acepta?c.dj:{}, obs:c.obs };
}

// --- Resumen (confirmación)
function resumenFicha(c, extra){
  var si=(c.salud||[]).filter(function(x){ return x==='S'; }).length, resp=(c.salud||[]).filter(function(x){ return x; }).length;
  var rows=[['Chico',c.nombre+' '+c.apellido],['DNI',c.dni||'—'],['Nacimiento',fdate(c.nacimiento)+(c.nacimiento?' ('+edad(c.nacimiento)+' años)':'')],
    ['Domicilio',[c.direccion,c.localidad].filter(Boolean).join(', ')||'—']]
    .concat(c.telContacto?[['Tel. contacto',fmtTel(c.telContacto)]]:[])
    .concat(nombreP(c.madre)?[['Madre',nombreP(c.madre)+(c.madre.telefono?' · '+fmtTel(c.madre.telefono):'')]]:[])
    .concat(nombreP(c.padre)?[['Padre',nombreP(c.padre)+(c.padre.telefono?' · '+fmtTel(c.padre.telefono):'')]]:[])
    .concat([['Obra social',(c.obraSocial||'—')+(c.osAfiliado?' · Nº '+c.osAfiliado:'')],
      ['Ficha de salud',resp?(si?si+(si===1?' respuesta SÍ':' respuestas SÍ'):'Todo NO'):'Sin completar'],
      ['Apto físico',(FichaUI.apto||c.apto)?'Presentado':'Falta'],
      ['Autorizados a retirar',(c.autorizados||[]).length?c.autorizados.map(function(a){return a.nombre;}).join(', '):'—'],
      ['Uso de imagen',c.imagen==='SI'?'Autoriza':c.imagen==='NO'?'No autoriza':'—'],
      ['Declaración jurada',c.dj&&c.dj.acepta?'Firma '+c.dj.nombre:(c.dj&&c.dj.fecha?'Firmada por '+c.dj.nombre:'Sin firmar')]])
    .concat(extra||[]);
  return '<div class="summary">'+rows.map(function(r){ return '<div class="r"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>'; }).join('')+'</div>';
}

// --- Bloques para la ficha del chico
function fichaSaludHtml(c){
  var qs=preguntasSalud(), s=c.salud||[], si=qs.filter(function(q,i){ return s[i]==='S'; }), resp=s.filter(function(x){return x;}).length;

    (canEdit()?' <label class="link" style="cursor:pointer">'+(c.apto?'Reemplazar':'Subir')+'<input type="file" accept="image/*" style="display:none" onchange="Ficha.subirApto(\''+c.id+'\',this)"></label>':'')+'</span>'+
    '<span>Respuestas SÍ</span><span>'+(resp?(si.length?esc(si.join(' · ')):'Ninguna'):'<span style="color:var(--muted)">Sin completar</span>')+'</span>'+
    (c.saludDetalle?'<span>Detalle</span><b>'+esc(c.saludDetalle)+'</b>':'')+'</div>';
  if((c.autorizados||[]).length) h+='<div class="group-title">Autorizados a retirar</div><div class="kv" style="margin-top:0">'+c.autorizados.map(function(a){ return '<span>'+esc(a.nombre)+'</span><span>'+(a.dni?'DNI '+esc(a.dni):'')+'</span>'; }).join('')+'</div>';
  h+='<div class="group-title">Autorizaciones</div><div class="kv" style="margin-top:0"><span>Uso de imagen</span><b>'+(c.imagen==='SI'?'Autoriza':c.imagen==='NO'?'<span style="color:var(--red)">No autoriza</span>':'—')+'</b>'+
    '<span>Declaración jurada</span><span>'+(c.dj&&c.dj.nombre?'Firmada por '+esc(c.dj.nombre)+' (DNI '+esc(c.dj.dni)+')'+(c.dj.fecha?' el '+esc(c.dj.fecha):''):'<span style="color:var(--muted)">Sin firmar</span>')+'</span></div>';
  return h;

/* ================= Asistencia (tomar lista) ================= */
function listasDe(gid){
  var by={};
  (D().asistencia||[]).forEach(function(a){ if(a.g!==gid) return; var x=by[a.f]||(by[a.f]={f:a.f,p:0,t:0,c:{}}); x.t++; if(a.p) x.p++; x.c[a.c]=a.p; });
  return Object.keys(by).sort().reverse().map(function(k){ return by[k]; });
}
function ultimaLista(gid){ return listasDe(gid)[0]||null; }
// Asistencia del chico en los últimos 30 días (solo clases en las que se tomó lista)
function asistenciaChico(cid){
  var p=D().hoy.split('-'), lim=new Date(+p[0],+p[1]-1,+p[2]-30), limS=lim.getFullYear()+'-'+('0'+(lim.getMonth()+1)).slice(-2)+'-'+('0'+lim.getDate()).slice(-2);
  var xs=(D().asistencia||[]).filter(function(a){ return a.c===cid; }).sort(function(a,b){ return b.f.localeCompare(a.f); });
  var mes=xs.filter(function(a){ return a.f>=limS; }), pres=mes.filter(function(a){ return a.p; }).length;
  return { total:mes.length, presentes:pres, pct: mes.length?Math.round(pres*100/mes.length):0, ultimas:xs.slice(0,10) };
}
function clasesHoyHtml(){
  if(!D().puedeTomarLista) return '';
  var cl=clasesHoy(); if(!cl.length) return '';
  return '<div class="group-title">Clases de hoy</div><div class="list" style="margin-bottom:14px">'+cl.map(function(x){
    var l=listasDe(x.g.id).filter(function(y){ return y.f===D().hoy; })[0];
    return '<div class="item" onclick="Lista.open(\''+x.g.id+'\')"><div class="time" style="min-width:52px;text-align:center;background:var(--navy);color:#fff;border-radius:10px;padding:6px 4px;font-weight:800">'+esc(x.h.inicio)+'</div>'+
      '<div class="main"><div class="t">'+esc(x.g.nombre||'Grupo')+'</div><div class="s">'+esc([sede(x.g.sede).nombre,x.h.cancha].filter(Boolean).join(' · '))+'</div></div>'+
      (l?'<span class="pill ok">'+l.p+'/'+l.t+' presentes</span>':'<span class="pill warn">Tomar lista</span>')+'</div>';
  }).join('')+'</div>';
}
var Lista = {
  open: function(gid, fecha){
    var d=D(), g=grupo(gid);
    fecha = fecha || d.hoy;
    var kids=d.chicos.filter(function(c){ return c.grupo===gid && c.activo; }).sort(function(a,b){ return (a.apellido+a.nombre).localeCompare(b.apellido+b.nombre); });
    var prev=listasDe(gid).filter(function(x){ return x.f===fecha; })[0];
    Lista.st={ gid:gid, fecha:fecha, pres:{}, ya:!!prev };
    kids.forEach(function(c){ if(prev && prev.c[c.id]) Lista.st.pres[c.id]=true; });
    var dias=horarios(g).map(function(h){ return h.dia; }), esDia=dias.indexOf(diaDe(fecha))>-1;
    var b='<div style="margin-top:14px"><b>'+esc(g.nombre||'Grupo')+'</b><div style="font-size:13px;color:var(--muted)">'+esc(sede(g.sede).nombre+' · '+horarioTxt(g))+'</div></div>'+
      '<label class="f">Fecha de la clase</label><input class="in" type="date" id="ls-f" value="'+fecha+'" max="'+d.hoy+'" onchange="Lista.open(\''+gid+'\',this.value)">'+
      (!esDia?'<div class="summary" style="font-size:13px;color:var(--warn)">Ojo: el '+fdate(fecha)+' es '+diaDe(fecha).toLowerCase()+' y este grupo entrena '+dias.join(' y ').toLowerCase()+'.</div>':'')+
      (prev?'<div class="summary" style="font-size:13px">Ya se tomó lista ese día. Podés corregirla y volver a guardar.</div>':'')+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px"><b id="ls-cnt"></b><span><button class="link" onclick="Lista.todos(true)">Todos presentes</button> · <button class="link" onclick="Lista.todos(false)">Ninguno</button></span></div>'+
      '<div class="list">'+kids.map(function(c){ return '<div class="item ls-kid" id="ls-'+c.id+'" onclick="Lista.toggle(\''+c.id+'\')">'+avatar(c)+'<div class="main"><div class="t">'+esc(c.nombre+' '+c.apellido)+'</div></div><span class="ls-mark"></span></div>'; }).join('')+'</div>'+
      '<div style="font-size:12px;color:var(--muted);margin-top:8px">Tocá a cada chico que vino. Los que no estén marcados quedan ausentes.</div>';
    openSheet('Tomar lista', b, '<button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn primary" style="flex:1" onclick="Lista.save()">Guardar lista</button>');
    Lista.pintar();
  },
  toggle: function(id){ Lista.st.pres[id]=!Lista.st.pres[id]; Lista.pintar(); },
  todos: function(on){ Array.prototype.forEach.call(document.querySelectorAll('.ls-kid'), function(el){ Lista.st.pres[el.id.slice(3)]=on; }); Lista.pintar(); },
  pintar: function(){
    var n=0, t=0;
    Array.prototype.forEach.call(document.querySelectorAll('.ls-kid'), function(el){ var on=!!Lista.st.pres[el.id.slice(3)]; t++; if(on) n++;
      el.classList.toggle('on',on); el.querySelector('.ls-mark').innerHTML = on?'<span class="pill ok">Presente</span>':'<span class="pill mute">Ausente</span>'; });
    $('ls-cnt').textContent = n+' de '+t+' presentes';
  },
  save: function(){
    var st=Lista.st, pres=Object.keys(st.pres).filter(function(k){ return st.pres[k]; });
    api('tomarLista',{ grupo:st.gid, fecha:val('ls-f')||st.fecha, presentes:pres }, 'Lista guardada ✓').then(function(){ closeSheet(); render(); });
  },
  historial: function(gid){
    var g=grupo(gid), ls=listasDe(gid), kids=D().chicos.filter(function(c){ return c.grupo===gid && c.activo; }).sort(function(a,b){ return a.apellido.localeCompare(b.apellido); });
    var b='<div style="margin-top:14px"><b>'+esc(g.nombre||'Grupo')+'</b><div style="font-size:13px;color:var(--muted)">'+esc(sede(g.sede).nombre+' · '+horarioTxt(g))+'</div></div>';
    if(!ls.length){ openSheet('Asistencia', b+'<div class="empty">Todavía no se tomó lista en este grupo.</div>', D().puedeTomarLista?'<button class="btn primary block" onclick="Lista.open(\''+gid+'\')">Tomar lista</button>':''); return; }
    var cols=ls.slice(0,8).reverse();
    b+='<div class="group-title">Últimas clases</div><div class="list">'+ls.slice(0,8).map(function(l){ return '<div class="item"'+(D().puedeTomarLista?' onclick="Lista.open(\''+gid+'\',\''+l.f+'\')"':' style="cursor:default"')+'><div class="main"><div class="t">'+esc(diaDe(l.f))+' '+fdate(l.f)+'</div></div><span class="pill '+(l.p/l.t>=.7?'ok':'warn')+'">'+l.p+' de '+l.t+'</span></div>'; }).join('')+'</div>';
    b+='<div class="group-title">Por chico (últimas '+cols.length+' clases)</div><div class="list">'+kids.map(function(c){
      var dots=cols.map(function(l){ var v=l.c[c.id]; return '<i class="dot '+(v===1?'si':v===0?'no':'na')+'" title="'+fdate(l.f)+'"></i>'; }).join('');
      var as=asistenciaChico(c.id);
      return '<div class="item" onclick="Ficha.open(\''+c.id+'\')"><div class="main"><div class="t">'+esc(c.nombre+' '+c.apellido)+'</div><div class="dots">'+dots+'</div></div><span style="font-weight:800;color:'+(as.total&&as.pct<60?'var(--red)':'inherit')+'">'+(as.total?as.pct+'%':'—')+'</span></div>';
    }).join('')+'</div><div style="font-size:12px;color:var(--muted);margin-top:8px">El porcentaje es de los últimos 30 días.</div>';
    openSheet('Asistencia', b, D().puedeTomarLista?'<button class="btn primary block" onclick="Lista.open(\''+gid+'\')">Tomar lista de hoy</button>':'');
  }
};
function diaDe(f){ var p=f.split('-'); return D().dias[(new Date(+p[0],+p[1]-1,+p[2]).getDay()+6)%7]; }
function asistenciaFichaHtml(c){
  var as=asistenciaChico(c.id);
  if(!as.ultimas.length) return '<div class="group-title">Asistencia</div><div class="empty" style="padding:12px">Todavía no hay listas tomadas.</div>';
  return '<div class="group-title">Asistencia</div><div class="kv" style="margin-top:0"><span>Últimos 30 días</span><b>'+(as.total?as.presentes+' de '+as.total+' clases ('+as.pct+'%)':'—')+'</b>'+
    '<span>Últimas clases</span><span class="dots">'+as.ultimas.slice().reverse().map(function(a){ return '<i class="dot '+(a.p?'si':'no')+'" title="'+fdate(a.f)+'"></i>'; }).join('')+'</span></div>';
}

/* ================= Inicio: para hacer hoy ================= */
function paraHoyHtml(){
  var d=D(), it=[];
  var activos=d.chicos.filter(function(c){ return c.activo; });
  if(d.vePlata){
    var deben=activos.filter(function(c){ return !c.pagoMes; });
    if(deben.length){
      var tot=deben.reduce(function(a,c){ return a+montoHoy(c); },0);
      it.push({cls:'r',ic:ICON.cash,t:deben.length+(deben.length===1?' chico debe ':' chicos deben ')+mesNombre(d.mesActual).split(' ')[0].toLowerCase(),
        s:money(tot)+(d.diaHoy>15?' · ya con recargo':' · el recargo arranca el 16'),btn:canEdit()?'Cobrar':'Ver',go:"go('cobrar')"});
    }
  }
  var np=(d.solicitudes||[]).length;
  if(np) it.push({cls:'w',ic:ICON.plus,t:np+(np===1?' inscripción para revisar':' inscripciones para revisar'),s:'Las completaron las familias desde el link',btn:'Revisar',go:'Solicitudes.open()'});
  var sinApto=activos.filter(function(c){ return !c.apto; }).length;
  if(sinApto) it.push({cls:'w',ic:ICON.kids,t:sinApto+(sinApto===1?' chico sin apto físico':' chicos sin apto físico'),s:'Pediselo a la familia',btn:'Ver',go:"S.chicosFiltro='apto';go('chicos')"});
  if(d.puedeTomarLista){
    var ahora=('0'+new Date().getHours()).slice(-2)+':'+('0'+new Date().getMinutes()).slice(-2);
    var faltan=clasesHoy().filter(function(x){ return x.h.inicio<=ahora && !listasDe(x.g.id).some(function(y){ return y.f===d.hoy; }); });
    if(faltan.length) it.push({cls:'w',ic:ICON.grid,t:faltan.length+(faltan.length===1?' lista de hoy sin tomar':' listas de hoy sin tomar'),s:faltan.map(function(x){ return x.h.inicio+' '+(x.g.nombre||'Grupo'); }).join(' · '),btn:'Tomar',go:"Lista.open('"+faltan[0].g.id+"')"});
  }
  var h='<div class="group-title">Para hacer hoy</div>';
  if(!it.length) return h+'<div class="item" style="cursor:default;margin-bottom:14px"><div class="sec-icon ic g">'+ICON.check+'</div><div class="main"><div class="t">Todo al día</div><div class="s">No hay pendientes por ahora</div></div></div>';
  return h+'<div class="list" style="margin-bottom:14px">'+it.map(function(x){
    return '<div class="item" onclick="'+x.go+'"><div class="sec-icon ic '+(x.cls==='w'?'w':x.cls)+'">'+x.ic+'</div><div class="main"><div class="t">'+x.t+'</div><div class="s">'+esc(x.s)+'</div></div><span class="pill '+(x.cls==='r'?'bad':'warn')+'">'+x.btn+'</span></div>';
  }).join('')+'</div>';
}
